<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeBot</title>
<style>
:root{--bg:#0d0c14;--rail:#121019;--bar:#16141f;--card:#1b1828;--card2:#221e32;--line:#2c2740;--tx:#ece9f5;--mut:#8b84a6;--ac:#8b6cf6;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;
  --c1:#e1505a;--c2:#e8963c;--c3:#46be78;--c4:#5a8cf0;--rw:64px;--th:46px;--pw:360px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:12.5px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
/* trilho de contas */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rw);background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:10px}
.logo{width:34px;height:34px;margin-bottom:6px}
.acc{position:relative;width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:var(--card);font-weight:800;font-size:13px;display:grid;place-items:center;transition:.15s}
.acc:hover{transform:translateY(-1px)}
.acc.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(139,108,246,.35)}
.acc .st{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--rail);background:var(--mut)}
.acc .vis{position:absolute;left:-9px;top:50%;width:4px;height:18px;margin-top:-9px;border-radius:2px;background:#fff;opacity:0}
.acc.on .vis{opacity:.85}
.rail .sp{flex:1}
.ico{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--mut);display:grid;place-items:center}
.ico:hover{background:var(--card);color:var(--tx)}
/* barra do topo */
.top{position:fixed;left:var(--rw);right:0;top:0;height:var(--th);background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;white-space:nowrap;overflow:hidden}
.brand{font-weight:800;font-size:14px}.brand b{color:var(--ac)}
.chip{color:var(--mut)}.chip b{color:var(--tx);font-weight:600}
.top .sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--mut);padding:4px 9px;border-radius:6px;font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.tb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;color:var(--tx)}
.tb:hover{border-color:var(--ac)}.tb.on{border-color:var(--ac);color:#cbbcff}
/* painel da conta */
.panel{position:fixed;right:0;top:var(--th);bottom:0;width:var(--pw);background:var(--bar);border-left:1px solid var(--line);display:flex;flex-direction:column}
.panel[hidden]{display:none}
.ph{padding:12px 14px 0;display:flex;align-items:center;gap:10px}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.ph .nm{flex:1;min-width:0}.ph .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.ph .nm span{color:var(--mut);font-size:11.5px}
.tabs{display:flex;padding:10px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:6px 0 8px;border-bottom:2px solid transparent;font-weight:600}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;display:flex;flex-direction:column;gap:8px}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{color:var(--mut);font-size:11px}
.bar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mut)}
.val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700}
.pill.ok{background:rgba(74,222,128,.14);color:var(--ok)}.pill.w{background:rgba(251,191,36,.14);color:var(--warn)}.pill.b{background:rgba(248,113,113,.14);color:var(--bad)}
.btn{border:0;border-radius:8px;padding:7px 10px;background:var(--ac);color:#fff;font-weight:600}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:wait}.btn.sm{padding:4px 9px;font-size:11.5px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini div{background:var(--card2);border-radius:8px;padding:6px;text-align:center}
.mini b{display:block;font-size:14px}.mini span{color:var(--mut);font-size:10.5px}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:7px;padding:2px;gap:2px}
.segs button{border:0;background:none;color:var(--mut);border-radius:5px;padding:4px 0;font-weight:600}
.segs button.on{background:var(--ac);color:#fff}
.best .h{font-size:15px;font-weight:700;margin-top:2px}
.msg{color:var(--mut);font-size:11.5px}
.empty{color:var(--mut);text-align:center;padding:12px 4px}
textarea{width:100%;min-height:360px;resize:vertical;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;font:11.5px/1.45 Consolas,monospace;padding:8px;user-select:text}
.log div{padding:3px 0;border-bottom:1px solid var(--line);word-break:break-word;font-size:11.5px;user-select:text}
canvas{display:block;width:100%;height:34px;margin-top:6px}
.accrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.accrow:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tip{position:fixed;left:calc(var(--rw) + 6px);background:#000c;padding:4px 8px;border-radius:6px;pointer-events:none;font-size:11.5px;display:none;z-index:9}
/* trilho: anel de XP (conic) em volta de cada conta, nivel embaixo */
.accw{display:flex;flex-direction:column;align-items:center;gap:2px}
.accw small{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.ring{position:relative;width:44px;height:44px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--c) var(--p),var(--card2) 0);display:grid;place-items:center;transition:.15s}
.ring:hover{transform:translateY(-1px)}
.ring .in{width:35px;height:35px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--c)}
.ring.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.ring .st{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--rail)}
.ring .vis{position:absolute;left:-10px;top:50%;width:4px;height:18px;margin-top:-9px;border-radius:2px;background:#fff;opacity:0}
.ring.on .vis{opacity:.85}
/* topo minimo: linha de acontecimentos */
.ticker{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;overflow:hidden;cursor:pointer}
.ticker .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
.ticker .ev.out{opacity:0}
.pchip{border:1px solid var(--warn);background:rgba(251,191,36,.12);color:var(--warn);border-radius:8px;padding:4px 10px;font-weight:700}
.pchip[hidden]{display:none}
/* lista compacta da conta */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px}
.kv>span{padding:4px 0;border-bottom:1px solid var(--line)}
.kv>span:nth-last-child(-n+2){border-bottom:0}
.kv .k{color:var(--mut)}
.kv .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* atual x melhor */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:stretch}
.cmp .box{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px;min-width:0}
.cmp .box.best{border-color:var(--ok)}
.cmp .box small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cmp .box b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .arr{align-self:center;color:var(--ok);font-weight:800}
/* estoque com previsao */
.stk{display:flex;flex-direction:column;gap:3px;padding:5px 0}
.stk .top2{display:flex;justify-content:space-between;gap:8px}
.stk .bar{position:relative;height:7px;margin-top:0}
.stk .min{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx);opacity:.6}
/* log com filtros */
.fl{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.fl button{border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:6px;padding:3px 8px;font-weight:600;font-size:11.5px}
.fl button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lg{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px;user-select:text}
.lg:last-child{border-bottom:0}
.lg .tp{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;letter-spacing:.04em}
.tp.compra{background:rgba(74,222,128,.14);color:var(--ok)}.tp.hunt{background:rgba(96,165,250,.14);color:var(--blue)}.tp.erro{background:rgba(248,113,113,.14);color:var(--bad)}.tp.outro{background:var(--card2);color:var(--mut)}
.lg .tx{word-break:break-word}.lg .tx.erro{color:var(--bad)}
/* aba Automacao: chave geral, ouro guardado e uma linha por item (abaixo de / compra ate) */
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:40px;height:22px;border-radius:11px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.15s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.15s}
.sw input:checked+.tr{background:var(--ac);border-color:var(--ac)}
.sw input:checked+.tr::after{left:20px;background:#fff}
.sw input:focus-visible+.tr{outline:2px solid var(--ac2);outline-offset:2px}
.num{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:inherit;font-variant-numeric:tabular-nums;text-align:right;user-select:text}
.num:focus{outline:none;border-color:var(--ac)}
.num.zero{color:var(--mut)}
.it2{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.it2:last-child{border-bottom:0}
.it2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it2 small{color:var(--mut);font-size:11px}
.it2 .q{display:inline-block;min-width:34px;text-align:center;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:5px;background:var(--card2);color:var(--mut);margin-right:5px}
.it2 .q.tem{background:rgba(139,108,246,.2);color:var(--ac2)}
.it2.off b{color:var(--mut);font-weight:600}
.it2.warn .num{border-color:var(--warn)}
.hd2{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-top:4px}
.hd2 span{text-align:right}
.plan div{padding:3px 0;border-bottom:1px solid var(--line);font-size:11.5px}.plan div:last-child{border-bottom:0}
/* avisos no canto (embaixo do painel) */
.toasts{position:fixed;right:10px;bottom:10px;width:calc(var(--pw) - 20px);display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:10px;box-shadow:0 10px 28px #000a;display:flex;flex-direction:column;gap:6px;animation:tin .2s ease-out}
.toast .tt{display:flex;align-items:center;gap:8px}
.toast .tt b{flex:1;min-width:0}
.toast .x{border:0;background:none;color:var(--mut);font-size:14px;padding:0 4px}
.toast .ac{display:flex;gap:6px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.ticker .ev{transition:none}}
</style></head><body>
<nav class="rail" id="rail">
  <svg class="logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#242034" stroke="#0d0c14" stroke-width="3"/><path d="M2 20a18 18 0 0 1 36 0z" fill="#8b6cf6"/><path d="M2 20h36" stroke="#0d0c14" stroke-width="3"/><circle cx="20" cy="20" r="6" fill="#0d0c14"/><circle cx="20" cy="20" r="3.4" fill="#ece9f5"/></svg>
  <div id="accs" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="sp"></div>
  <button class="ico" title="Recarregar todas as contas" onclick="send('reloadall')">⟳</button>
  <button class="ico" title="Ajustes (regras)" onclick="openTab('regras')">⚙</button>
</nav>
<div class="tip" id="tip"></div>
<header class="top">
  <span class="brand">Poke<b>Bot</b></span>
  <div class="ticker" id="ticker" title="Últimas ações do robô (clique para abrir o log)"><span class="ev" id="tickEv"><span class="msg">sem ações ainda</span></span></div>
  <button class="pchip" id="pchip" hidden title="Pedidos esperando sua aprovação">0 pendentes</button>
  <div class="seg" id="telas" title="Quantas contas ver ao mesmo tempo (Ctrl+1…4 = só uma, Ctrl+0 = as 4)"></div>
  <div class="seg"><button onclick="send('zoom-')" title="Menos zoom">−</button><button id="zoomv" disabled style="cursor:default">–</button><button onclick="send('zoom+')" title="Mais zoom">+</button></div>
  <button class="tb" id="bPainel" onclick="send('painel')" title="Mostrar/esconder o painel da conta (F3)">Painel</button>
  <button class="tb" onclick="send('cheia')" title="Só as contas, sem moldura (F11; Esc volta)">Tela cheia</button>
</header>
<aside class="panel" id="panel">
  <div class="ph"><div class="badge" id="pBadge">C1</div><div class="nm"><b id="pNome">–</b><span id="pSub">–</span></div>
    <button class="btn g sm" onclick="send('home:'+sel)" title="Voltar para pokeidle.io">Jogo</button><button class="btn g sm" onclick="send('reload:'+sel)" title="Recarregar">⟳</button></div>
  <div class="tabs" id="tabs"><button data-t="conta" class="on">Conta</button><button data-t="auto">Auto</button><button data-t="hunts">Hunts</button><button data-t="sistema">Sistema</button><button data-t="regras">Regras</button><button data-t="log">Log</button></div>
  <div class="body" id="body"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
const NAMES=window.CONTAS||['conta1','conta2','conta3','conta4'],COR=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'–':Number(n).toLocaleString('pt-BR');
const curto=n=>n==null?'–':n>=1e6?(n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':n>=1e4?(n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':fmt(n);
const gb=mb=>mb==null?'–':mb>=1024?(mb/1024).toLocaleString('pt-BR',{maximumFractionDigits:1})+' GB':Math.round(mb)+' MB';
const api=async p=>{const r=await fetch('/'+p);const j=await r.json();if(!j.ok)throw new Error(j.error);return j.result};
const wv=window.chrome&&window.chrome.webview;const send=m=>{if(wv)wv.postMessage(m)};
let sel=0,telas=4,painel=true,zoom=null,tab='conta',crit=localStorage.getItem('crit')||'XP/h';
let status={},metrics=null,ranks={},logs=[],estoque={},inicio=Date.now(),hist=[];
const busy={};
let pend=[],nPoll=0; // pedidos de aprovacao (overview.pending)
let consumos={},logF='tudo';

// ---------- trilho + topo ----------
function drawRail(){
  // cada conta: anel que enche com o XP do nivel, bolinha de status, nivel embaixo
  $('#accs').innerHTML=NAMES.map((n,i)=>{const s=status[n]||{};const c=s.error?'var(--bad)':s.loggedIn?'var(--ok)':'var(--warn)';
    const vis=metrics&&metrics.visiveis?metrics.visiveis[i]:1,p=s.xpMax?Math.round(100*s.xp/s.xpMax):0;
    return `<div class="accw"><button class="ring ${i===sel?'sel':''} ${vis?'on':''}" style="--c:${COR[i]};--p:${p}%" data-i="${i}" data-n="${n}" aria-label="${n}, ${p}% do nível"><span class="in">C${i+1}</span><span class="vis"></span><span class="st" style="background:${c}"></span></button><small>${s.level?'Nv '+s.level:'–'}</small></div>`}).join('');
  $('#telas').innerHTML=[1,2,3,4,5].map(n=>`<button class="${n===telas?'on':''}" onclick="send('telas:${n}')" title="${n===5?'Uma grande e as outras 3 pequenas':n===1?'Só a selecionada':n+' contas lado a lado'}">${n===5?'1+3':n+(n===1?' tela':' telas')}</button>`).join('');
  $('#bPainel').classList.toggle('on',painel);
  $('#zoomv').textContent=zoom?Math.round(zoom*100)+'%':'–';
  const pc=$('#pchip');pc.hidden=!pend.length;pc.textContent=pend.length+(pend.length===1?' pendente':' pendentes');
}
$('#accs').addEventListener('click',e=>{const b=e.target.closest('.ring');if(b)send('select:'+b.dataset.i)});
$('#accs').addEventListener('mouseover',e=>{const b=e.target.closest('.ring');const t=$('#tip');if(!b){t.style.display='none';return}
  const s=status[b.dataset.n]||{};t.textContent=b.dataset.n+(s.loggedIn?` · Nv ${s.level} · ${curto(s.xpPorHora)} XP/h · ${s.hunt?s.hunt.replace(' · nível ',' Nv '):'parado'}`:'');
  t.style.top=(b.getBoundingClientRect().top+12)+'px';t.style.display='block'});
$('#accs').addEventListener('mouseleave',()=>$('#tip').style.display='none');

// ---------- linha de acontecimentos (topo) ----------
const IDX=n=>NAMES.indexOf(n);
function tipoLog(w){return /falhou|erro|nao |não /i.test(w)?'erro':/recompra|compr/i.test(w)?'compra':/hunt|irMelhor|cacar|proposta|trocar|analise/i.test(w)?'hunt':'outro'}
function hora(t){return new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
let tickI=0;
function ticker(){const ev=logs.filter(e=>!/^(openall|economia)/.test(e.what)).slice(0,6);const el=$('#tickEv');
  if(!ev.length){el.innerHTML='<span class="msg">sem ações ainda</span>';return}
  const e=ev[tickI%ev.length];tickI++;el.classList.add('out');
  setTimeout(()=>{const i=IDX(e.acc);el.innerHTML=`<span class="msg">${hora(e.t)}</span> ${i>=0?`<b style="color:${COR[i]}">C${i+1}</b>`:''} <span style="${tipoLog(e.what)==='erro'?'color:var(--bad)':''}">${esc(e.what.replace(/^hunt: /,''))}</span>`;el.classList.remove('out')},200)}
setInterval(ticker,5000);
$('#ticker').onclick=()=>openTab('log');
$('#pchip').onclick=()=>{toastsVistos.clear();drawToasts()};

// ---------- painel ----------
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)openTab(b.dataset.t)};
function openTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(!painel)send('painel');drawPanel(true)}
function risk(o){if(!o)return['ok',''];if(o.umGolpe)return['b','☠ 1 golpe'];const n=o.riscoPct||0;return[n>=40?'b':n>=15?'w':'ok','risco '+n+'%']}
function huntLinha(o,i){if(!o)return'';const [k,l]=risk(o);
  return `<div class="row"><span><b>${esc(o.pokemon)} Nv ${o.nivel}</b><small>${esc(o.regiao||'')} · ${fmt(o.abatesH)} abates/h · <span class="pill ${k}">${l}</span></small></span>
   <span class="val">${esc((o.valor||'').replace(' capturas/h',''))}<br><button class="btn sm" data-ir="${esc(o.pokemon)}|${o.nivel}">Ir caçar</button></span></div>`}
function drawPanel(force){

  const ir=e.target.closest('[data-ir]');if(ir){const [nome,nv]=ir.dataset.ir.split('|');ir.disabled=true;ir.textContent='indo…';
    busy.anal='Trocando para '+nome+' Nv '+nv+' (o jogo só aceita fora de combate; pode levar alguns segundos)…';drawPanel(true);
    try{await api(`cacar?acc=${NAMES[sel]}&nome=${encodeURIComponent(nome)}&nivel=${nv}`);busy.anal='Caçando '+nome+' Nv '+nv+'.'}catch(x){busy.anal='Não trocou: '+x.message}drawPanel(true);return}
  if(e.target.id==='bMelhor'||e.target.id==='bMelhor4'){const all=e.target.id==='bMelhor4';busy.anal=all?'Colocando as 4 contas na melhor hunt (~1–2 min)…':'Indo para a melhor hunt…';drawPanel(true);
    try{const r=await api(`irmelhor?crit=${encodeURIComponent(crit)}&acc=${all?'todas':NAMES[sel]}`);ranks=await api('rankings');
      busy.anal=Object.entries(r).map(([k,v])=>(all?k+': ':'')+v).join(' · ')}catch(x){busy.anal='Erro: '+x.message}drawPanel(true);return}
  if(e.target.id==='bAnal'||e.target.id==='bAnal4'){const all=e.target.id==='bAnal4';busy.anal=all?'Analisando as 4 contas (~30 s)…':'Analisando…';drawPanel(true);
    try{await api(all?'rankall':'rank?acc='+NAMES[sel]);ranks=await api('rankings');busy.anal='Pronto.'}catch(x){busy.anal='Erro: '+x.message}drawPanel(true);return}
  if(e.target.id==='bRec'){busy.rec='Conferindo estoque e comprando o que falta…';drawPanel(true);
    try{const r=await api('recomprar?acc='+NAMES[sel]);const f=r.compras.filter(c=>c.resultado);busy.rec=f.length?'Comprado: '+f.map(c=>c.qtd+' '+c.item).join(', ')+'.':'Nada a comprar: estoque acima do mínimo.';loadEstoque(true)}catch(x){busy.rec='Erro: '+x.message}drawPanel(true);return}
  if(e.target.id==='bSave'){const v=$('#rules').value;try{JSON.parse(v)}catch{$('#mSave').textContent='JSON inválido — nada salvo.';return}
    await fetch('/saverules',{method:'POST',body:v});$('#mSave').textContent='Salvo.';return}
});

// ---------- dados ----------
function onMsg(x){
  if(x.tipo==='estado'){const mudou=x.sel!==sel;sel=x.sel;telas=x.telas;painel=x.painel;zoom=x.zoom;$('#panel').hidden=!painel||x.cheia;drawRail();if(mudou){loadEstoque(true)}drawPanel(mudou);return}
  if(x.contas){metrics=x;hist.push(x.sistema.cpu);if(hist.length>60)hist.shift();
    if(typeof x.foco==='number'&&x.foco!==sel){sel=x.foco}drawRail();if(tab==='sistema'||tab==='conta')drawPanel()}
}
if(wv){wv.addEventListener('message',e=>{try{onMsg(JSON.parse(e.data))}catch{}});send('estado')}
async function poll(){try{const o=await api('overview');status=o.status||{};logs=o.log||[];pend=o.pending||[];
  if(++nPoll%10===0)api('rankings').then(r=>{ranks=r}).catch(()=>{});if(nPoll===1)ticker();drawRail();drawToasts();if(tab!=='regras'&&tab!=='auto')drawPanel()}catch{}}
async function loadEstoque(force){const n=NAMES[sel];if(!force&&estoque[n]&&Date.now()-estoque[n].at<20000)return;
  try{const [e,c]=await Promise.all([api('estoque?acc='+n),api('consumo?acc='+n).catch(()=>null)]);estoque[n]={...e,at:Date.now()};if(c)consumos[n]=c;if(tab==='conta')drawPanel()}catch{}}
api('rankings').then(r=>{ranks=r;drawPanel(true)}).catch(()=>{});
poll();setInterval(poll,3000);setInterval(()=>loadEstoque(false),20000);loadEstoque(true);drawRail();drawPanel(true);
addEventListener('keydown',e=>{if(e.key==='F11'){e.preventDefault();send('cheia')}if(e.key==='F3'){e.preventDefault();send('painel')}});
</script></body></html>
